{
  id: "D04",
  name: "Outreach & Validation",
  cluster: "validation",
  head: {
    agent_id: "outreach.head",
    model: "opus",
    system_prompt_ref: "prompts/D04/head.md",
    tools: [
      "web_search",
      "web_fetch",
      "memory_read",
      "memory_write",
      "linq.send_card",
      "elevenlabs.tts"
    ],
    max_tokens_per_run: 90000
  },
  critic: {
    agent_id: "outreach.critic",
    model: "sonnet",
    rubric_ref: "prompts/D04/critic-rubric.md",
    max_tokens_per_run: 30000
  },
  workers: [
    {
      agent_id: "outreach.miner",
      model: "sonnet",
      replicas: 2,
      system_prompt_ref: "prompts/D04/miner.md",
      tools: [
        "web_search",
        "web_fetch",
        "memory_read",
        "memory_write",
        "composio.gmail_send",
        "linq.send_card",
        "elevenlabs.tts",
        "terac.post_requisition"
      ],
      max_tokens_per_run: 60000
    },
    {
      agent_id: "outreach.scriptwright",
      model: "sonnet",
      replicas: 1,
      system_prompt_ref: "prompts/D04/scriptwright.md",
      tools: [
        "web_search",
        "web_fetch",
        "memory_read",
        "memory_write",
        "composio.gmail_send",
        "linq.send_card",
        "elevenlabs.tts",
        "terac.post_requisition"
      ],
      max_tokens_per_run: 60000
    },
    {
      agent_id: "outreach.composer",
      model: "sonnet",
      replicas: 1,
      system_prompt_ref: "prompts/D04/composer.md",
      tools: [
        "web_search",
        "web_fetch",
        "memory_read",
        "memory_write",
        "composio.gmail_send",
        "linq.send_card",
        "elevenlabs.tts",
        "terac.post_requisition"
      ],
      max_tokens_per_run: 60000
    },
    {
      agent_id: "outreach.interviewer",
      model: "sonnet",
      replicas: 1,
      system_prompt_ref: "prompts/D04/interviewer.md",
      tools: [
        "web_search",
        "web_fetch",
        "memory_read",
        "memory_write",
        "composio.gmail_send",
        "linq.send_card",
        "elevenlabs.tts",
        "terac.post_requisition"
      ],
      max_tokens_per_run: 60000
    },
    {
      agent_id: "outreach.extractor",
      model: "sonnet",
      replicas: 1,
      system_prompt_ref: "prompts/D04/extractor.md",
      tools: [
        "web_search",
        "web_fetch",
        "memory_read",
        "memory_write",
        "composio.gmail_send",
        "linq.send_card",
        "elevenlabs.tts",
        "terac.post_requisition"
      ],
      max_tokens_per_run: 60000
    }
  ],
  concurrency: 8,
  budget: {
    default_envelope_usd: 6,
    hard_cap_usd: 12
  },
  io: {
    input: [
      "NicheDossier",
      "SharpenedIdea"
    ],
    output: "ClaimLedger",
    min_outputs: 1
  },
  gates: [
    "outbound_to_real_person",
    "money_out"
  ],
  sandbox: {
    image: "zeroth/dept-base:latest",
    cpu: 2,
    mem_mb: 2048,
    pause_between_cycles: true,
    egress_allowlist: [
      "api.anthropic.com",
      "*.zeroth.local"
    ]
  },
  sla: {
    soft_deadline_s: 300,
    on_timeout: "return_partial"
  }
}
