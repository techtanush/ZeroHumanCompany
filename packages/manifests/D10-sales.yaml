id: D10
name: Sales
cluster: gtm
head:
  agent_id: sales.head
  model: opus
  system_prompt_ref: prompts/D10/head.md
  tools:
    - web_search
    - web_fetch
    - composio.gmail_send
    - linq.send_card
    - linq.await_reply
    - elevenlabs.create_agent
    - elevenlabs.place_call
    - elevenlabs.transcribe
    - stripe.create_payment_link
    - whop.create_checkout
    - dodo.create_checkout
    - crm.upsert
    - memory_read
    - memory_write
    - pioneer.classify
  max_tokens_per_run: 90000
critic:
  agent_id: sales.critic
  model: sonnet
  rubric_ref: prompts/D10/critic-rubric.md
  max_tokens_per_run: 30000
workers:
  - agent_id: sales.copywriter
    model: sonnet
    replicas: 1
    system_prompt_ref: prompts/D10/copywriter.md
    tools:
      - composio.gmail_send
      - linq.send_card
      - linq.await_reply
      - stripe.create_payment_link
      - whop.create_checkout
      - dodo.create_checkout
      - crm.upsert
      - memory_read
      - memory_write
    max_tokens_per_run: 60000
  - agent_id: sales.closer
    model: sonnet
    replicas: 1
    system_prompt_ref: prompts/D10/closer.md
    tools:
      - composio.gmail_send
      - linq.send_card
      - linq.await_reply
      - elevenlabs.create_agent
      - elevenlabs.place_call
      - elevenlabs.transcribe
      - stripe.create_payment_link
      - whop.create_checkout
      - dodo.create_checkout
      - crm.upsert
      - memory_read
      - memory_write
    max_tokens_per_run: 60000
  - agent_id: sales.ops
    model: sonnet
    replicas: 1
    system_prompt_ref: prompts/D10/ops.md
    tools:
      - composio.gmail_send
      - linq.send_card
      - linq.await_reply
      - stripe.create_payment_link
      - whop.create_checkout
      - dodo.create_checkout
      - crm.upsert
      - memory_read
      - memory_write
    max_tokens_per_run: 60000
  - agent_id: sales.qualification-analyst
    model: sonnet
    replicas: 1
    system_prompt_ref: prompts/D10/qualification-analyst.md
    tools: &a1
      - web_search
      - web_fetch
      - calc
      - memory_read
      - composio.gmail_send
      - linq.send_card
      - linq.await_reply
      - elevenlabs.create_agent
      - elevenlabs.place_call
      - elevenlabs.transcribe
      - stripe.create_payment_link
      - whop.create_checkout
      - dodo.create_checkout
      - crm.upsert
      - pioneer.classify
    max_tokens_per_run: 60000
  - agent_id: sales.proposal-writer
    model: sonnet
    replicas: 1
    system_prompt_ref: prompts/D10/proposal-writer.md
    tools: *a1
    max_tokens_per_run: 60000
  - agent_id: sales.crm-steward
    model: haiku
    replicas: 1
    system_prompt_ref: prompts/D10/crm-steward.md
    tools: *a1
    max_tokens_per_run: 60000
  - agent_id: sales.discount-guard
    model: sonnet
    replicas: 1
    system_prompt_ref: prompts/D10/discount-guard.md
    tools: *a1
    max_tokens_per_run: 60000
  - agent_id: sales.demo-prepper
    model: sonnet
    replicas: 1
    system_prompt_ref: prompts/D10/demo-prepper.md
    tools: *a1
    max_tokens_per_run: 60000
  - agent_id: sales.handoff-coordinator
    model: sonnet
    replicas: 1
    system_prompt_ref: prompts/D10/handoff-coordinator.md
    tools: *a1
    max_tokens_per_run: 60000
concurrency: 8
budget:
  default_envelope_usd: 3
  hard_cap_usd: 8
io:
  input:
    - LeadBatch
    - GTMPlan
  output: Deal
  min_outputs: 1
gates:
  - outbound_to_real_person
  - money_out
sandbox:
  image: zeroth/dept-base:latest
  cpu: 2
  mem_mb: 2048
  pause_between_cycles: true
  egress_allowlist:
    - api.anthropic.com
    - "*.zeroth.local"
sla:
  soft_deadline_s: 300
  on_timeout: return_partial
