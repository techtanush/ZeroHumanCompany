  - agent_id: outreach.voice-disclosure
    model: sonnet
    replicas: 1
    system_prompt_ref: prompts/D04/voice-disclosure.md
    tools: *a1
    max_tokens_per_run: 60000
  - agent_id: outreach.insight-extractor
    model: sonnet
    replicas: 1
    system_prompt_ref: prompts/D04/insight-extractor.md
    tools: *a1
    max_tokens_per_run: 60000
  - agent_id: outreach.incentive-planner
    model: sonnet
    replicas: 1
    system_prompt_ref: prompts/D04/incentive-planner.md
    tools: *a1
    max_tokens_per_run: 60000
  - agent_id: outreach.warm-lead-converter
    model: sonnet
    replicas: 1
    system_prompt_ref: prompts/D04/warm-lead-converter.md
    tools:
      - web_search
      - web_fetch
      - calc
      - memory_read
      - leadgen.enrich
      - crm.upsert
    max_tokens_per_run: 60000
concurrency: 8
budget:
  default_envelope_usd: 6
  hard_cap_usd: 12
io:
  input:
    - NicheDossier
    - SharpenedIdea
  output: ClaimLedger
  min_outputs: 1
gates:
  - outbound_to_real_person
  - money_out
  - voice_clone_consent
sandbox:
  image: zeroth/dept-base:latest
  cpu: 2
  mem_mb: 2048
  pause_between_cycles: true
  egress_allowlist:
    - api.anthropic.com
    - "*.zeroth.local"
sla:
  soft_deadline_s: 300
  on_timeout: return_partial
