services:
  - type: web
    name: ycbf-kernel
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: corepack pnpm@9.15.4 install --frozen-lockfile --prod=false && corepack pnpm@9.15.4 -F @zeroth/kernel typecheck && corepack pnpm@9.15.4 -F @zeroth/kernel build
    startCommand: corepack pnpm@9.15.4 -F @zeroth/kernel start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: "10000"
      - key: PGLITE_DIR
        value: memory
      - key: ZEROTH_ENV
        value: prod
      - key: ZEROTH_TOOLS
        value: real
      - key: ZEROTH_LLM
        value: real
      - key: ZEROTH_TIME_SCALE
        value: "1.0"
      - key: ZEROTH_KILL_SWITCH
        value: off
      - key: KERNEL_URL
        value: https://zerohuman-kernel.onrender.com
      - key: COMPANY_NAME
        value: YCBF
      - key: KERNEL_SHARED_TOKEN
        sync: false
      - key: KERNEL_SIGNING_KEY
        sync: false
      - key: KERNEL_VAULT_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_BASE_URL
        value: https://api.anthropic.com
      - key: ANTHROPIC_MODEL_OPUS
        value: claude-sonnet-4-6
      - key: ANTHROPIC_MODEL_SONNET
        value: claude-sonnet-4-6
      - key: ANTHROPIC_MODEL_HAIKU
        value: claude-sonnet-4-6
      - key: TERAC_API_KEY
        sync: false
      - key: TERAC_BASE_URL
        value: https://terac.com/api/external/v2
      - key: BAND_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SUPERSERVE_POOL_SIZE
        value: "4"
      - key: LINQ_API_KEY
        sync: false
      - key: LINQ_FROM_NUMBER
        sync: false
      - key: FOUNDER_PHONE
        sync: false
      - key: COMPOSIO_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: SIMPOP_SEED
        value: "42"
      - key: SIMPOP_ARCHETYPES
        value: "12"
      - key: DEMO_VENTURE_ID
        value: demo-1
      - key: DEMO_REPLAY_SPEED
        value: "8"
      - key: DEMO_OFFLINE
        value: "false"
