id: D08
name: Strategy
cluster: gtm
head:
  agent_id: strategy.head
  model: opus
  system_prompt_ref: prompts/D08/head.md
  tools:
    - web_search
    - web_fetch
    - calc
    - memory_read
    - memory_write
  max_tokens_per_run: 90000
critic:
  agent_id: strategy.critic
  model: sonnet
  rubric_ref: prompts/D08/critic-rubric.md
  max_tokens_per_run: 30000
workers:
  - agent_id: strategy.positioning
    model: sonnet
    replicas: 1
    system_prompt_ref: prompts/D08/positioning.md
    tools:
      - web_search
      - web_fetch
      - calc
      - memory_read
      - memory_write
    max_tokens_per_run: 60000
  - agent_id: strategy.pricing
    model: sonnet
    replicas: 1
    system_prompt_ref: prompts/D08/pricing.md
    tools:
      - web_search
      - web_fetch
      - calc
      - memory_read
      - memory_write
    max_tokens_per_run: 60000
  - agent_id: strategy.launch
    model: sonnet
    replicas: 1
    system_prompt_ref: prompts/D08/launch.md
    tools:
      - web_search
      - web_fetch
      - calc
      - memory_read
      - memory_write
    max_tokens_per_run: 60000
  - agent_id: strategy.channel-strategist
    model: sonnet
    replicas: 1
    system_prompt_ref: prompts/D08/channel-strategist.md
    tools: &a1
      - web_search
      - web_fetch
      - calc
      - memory_read
      - pioneer.classify
    max_tokens_per_run: 60000
  - agent_id: strategy.experiment-designer
    model: sonnet
    replicas: 1
    system_prompt_ref: prompts/D08/experiment-designer.md
    tools: *a1
    max_tokens_per_run: 60000
  - agent_id: strategy.content-strategist
    model: sonnet
    replicas: 1
    system_prompt_ref: prompts/D08/content-strategist.md
    tools: *a1
    max_tokens_per_run: 60000
  - agent_id: strategy.partnership-scout
    model: sonnet
    replicas: 1
    system_prompt_ref: prompts/D08/partnership-scout.md
    tools: *a1
    max_tokens_per_run: 60000
  - agent_id: strategy.plg-analyst
    model: sonnet
    replicas: 1
    system_prompt_ref: prompts/D08/plg-analyst.md
    tools: *a1
    max_tokens_per_run: 60000
  - agent_id: strategy.sales-playbook-writer
    model: sonnet
    replicas: 1
    system_prompt_ref: prompts/D08/sales-playbook-writer.md
    tools: *a1
    max_tokens_per_run: 60000
concurrency: 8
budget:
  default_envelope_usd: 3
  hard_cap_usd: 6
io:
  input:
    - ProductSpec
  output: GTMPlan
  min_outputs: 1
gates:
  - public_content
sandbox:
  image: zeroth/dept-base:latest
  cpu: 2
  mem_mb: 2048
  pause_between_cycles: true
  egress_allowlist:
    - api.anthropic.com
    - "*.zeroth.local"
sla:
  soft_deadline_s: 300
  on_timeout: return_partial
