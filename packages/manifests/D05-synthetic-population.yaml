{
  id: "D05",
  name: "Synthetic Population",
  cluster: "validation",
  head: {
    agent_id: "synthetic.head",
    model: "sonnet",
    system_prompt_ref: "prompts/D05/head.md",
    tools: [
      "web_search",
      "web_fetch",
      "calc",
      "memory_read",
      "memory_write",
      "pioneer.classify"
    ],
    max_tokens_per_run: 90000
  },
  critic: {
    agent_id: "synthetic.critic",
    model: "sonnet",
    rubric_ref: "prompts/D05/critic-rubric.md",
    max_tokens_per_run: 30000
  },
  workers: [
    {
      agent_id: "synthetic.panel-builder",
      model: "sonnet",
      replicas: 1,
      system_prompt_ref: "prompts/D05/panel-builder.md",
      tools: [
        "web_search",
        "web_fetch",
        "calc",
        "memory_read",
        "memory_write",
        "pioneer.classify"
      ],
      max_tokens_per_run: 60000
    },
    {
      agent_id: "synthetic.calibrator",
      model: "sonnet",
      replicas: 1,
      system_prompt_ref: "prompts/D05/calibrator.md",
      tools: [
        "web_search",
        "web_fetch",
        "calc",
        "memory_read",
        "memory_write",
        "pioneer.classify"
      ],
      max_tokens_per_run: 60000
    },
    {
      agent_id: "synthetic.analyst",
      model: "sonnet",
      replicas: 1,
      system_prompt_ref: "prompts/D05/analyst.md",
      tools: [
        "web_search",
        "web_fetch",
        "calc",
        "memory_read",
        "memory_write",
        "pioneer.classify"
      ],
      max_tokens_per_run: 60000
    }
  ],
  concurrency: 4,
  budget: {
    default_envelope_usd: 1.5,
    hard_cap_usd: 3
  },
  io: {
    input: [
      "SharpenedIdea",
      "NicheDossier"
    ],
    output: "SyntheticPanelResult",
    min_outputs: 1
  },
  gates: [],
  sandbox: {
    image: "zeroth/dept-base:latest",
    cpu: 2,
    mem_mb: 2048,
    pause_between_cycles: true,
    egress_allowlist: [
      "api.anthropic.com",
      "*.zeroth.local"
    ]
  },
  sla: {
    soft_deadline_s: 300,
    on_timeout: "return_partial"
  }
}
