id: D04
name: Outreach & Validation
cluster: validation
head:
  agent_id: outreach.head
  model: opus
  system_prompt_ref: prompts/D04/head.md
  tools:
    - web_search
    - web_fetch
    - memory_read
    - memory_write
    - linq.send_card
    - linq.await_reply
    - elevenlabs.tts
    - elevenlabs.clone_voice
    - elevenlabs.create_agent
    - elevenlabs.place_call
    - elevenlabs.transcribe
  max_tokens_per_run: 90000
critic:
  agent_id: outreach.critic
  model: sonnet
  rubric_ref: prompts/D04/critic-rubric.md
  max_tokens_per_run: 30000
workers:
  - agent_id: outreach.miner
    model: sonnet
    replicas: 2
    system_prompt_ref: prompts/D04/miner.md
    tools:
      - web_search
      - web_fetch
      - leadgen.search
      - leadgen.enrich
      - crm.upsert
      - memory_read
      - memory_write
      - composio.gmail_send
      - linq.send_card
      - linq.await_reply
      - elevenlabs.tts
      - elevenlabs.create_agent
      - elevenlabs.place_call
      - elevenlabs.transcribe
      - terac.post_requisition
    max_tokens_per_run: 60000
  - agent_id: outreach.scriptwright
    model: sonnet
    replicas: 1
    system_prompt_ref: prompts/D04/scriptwright.md
    tools:
      - web_search
      - web_fetch
      - memory_read
      - memory_write
      - composio.gmail_send
      - linq.send_card
      - linq.await_reply
      - elevenlabs.tts
      - elevenlabs.create_agent
      - elevenlabs.place_call
      - elevenlabs.transcribe
      - terac.post_requisition
    max_tokens_per_run: 60000
  - agent_id: outreach.composer
    model: sonnet
    replicas: 1
    system_prompt_ref: prompts/D04/composer.md
    tools:
      - web_search
      - web_fetch
      - memory_read
      - memory_write
      - composio.gmail_send
      - linq.send_card
      - linq.await_reply
      - elevenlabs.tts
      - elevenlabs.create_agent
      - elevenlabs.place_call
      - elevenlabs.transcribe
      - terac.post_requisition
    max_tokens_per_run: 60000
  - agent_id: outreach.interviewer
    model: sonnet
    replicas: 1
    system_prompt_ref: prompts/D04/interviewer.md
    tools:
      - web_search
      - web_fetch
      - memory_read
      - memory_write
      - composio.gmail_send
      - linq.send_card
      - linq.await_reply
      - elevenlabs.tts
      - elevenlabs.create_agent
      - elevenlabs.place_call
      - elevenlabs.transcribe
      - terac.post_requisition
    max_tokens_per_run: 60000
  - agent_id: outreach.extractor
    model: sonnet
    replicas: 1
    system_prompt_ref: prompts/D04/extractor.md
    tools:
      - web_search
      - web_fetch
      - memory_read
      - memory_write
      - composio.gmail_send
      - linq.send_card
      - linq.await_reply
      - elevenlabs.tts
      - elevenlabs.create_agent
      - elevenlabs.place_call
      - elevenlabs.transcribe
      - terac.post_requisition
    max_tokens_per_run: 60000
  - agent_id: outreach.consent-officer
    model: sonnet
    replicas: 1
    system_prompt_ref: prompts/D04/consent-officer.md
    tools: &a1
      - web_search
      - web_fetch
      - calc
      - memory_read
    max_tokens_per_run: 60000
  - agent_id: outreach.scheduler
    model: sonnet
    replicas: 1
    system_prompt_ref: prompts/D04/scheduler.md
    tools:
      - web_search
      - web_fetch
      - calc
      - memory_read
      - crm.upsert
      - linq.send_card
      - linq.await_reply
